[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-reader"
version = "0.1.0"
description = "Convert LaTeX research papers into a Readwise-Reader-style HTML reading experience, with a local library web app."
requires-python = ">=3.9"
dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "readability-lxml>=0.8",
]

[project.scripts]
paper-reader = "paper_reader.cli:main"

[tool.setuptools]
packages = ["paper_reader"]
