<!DOCTYPE html>
<html>
<style>
  body { padding: 50px; background: #eee; }
  .card {
    position: relative;
    width: 300px;
    height: 100px;
    border: 1px solid blue;
    border-radius: 10px;
    background: white;
  }
  .track1 {
    position: absolute;
    left: 0; bottom: 0; right: 0;
    height: 4px;
    background: transparent;
    overflow: hidden;
    border-radius: 0 0 9px 9px;
    transform: translateZ(0);
  }
  .track2 {
    position: absolute;
    left: -1px; bottom: -1px; right: -1px;
    height: 4px;
    background: transparent;
    overflow: hidden;
    border-radius: 0 0 10px 10px;
    transform: translateZ(0);
  }
  .fill {
    height: 100%;
    background: blue;
    width: 80%;
  }
</style>
<body>
  <div class="card">
    <div class="track1"><div class="fill"></div></div>
  </div>
  <br>
  <div class="card">
    <div class="track2"><div class="fill"></div></div>
  </div>
</body>
</html>
